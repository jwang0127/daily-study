<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日认识一个主题</title>
<style>:root{--ink:#172235;--muted:#667085;--paper:#f6f7fb;--card:#fff;--line:#e6e8ee;--accent:#4f46e5;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:auto;padding:38px 20px 80px}.nav{display:flex;justify-content:space-between;margin-bottom:44px;color:var(--muted)}.nav a{color:var(--accent);text-decoration:none;font-weight:700}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:24px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.12;margin:10px 0}.subtitle{font-size:20px;color:var(--muted);margin:0}.star{font-size:70px;color:#f4b740}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 10px 32px #17223508}.wide{grid-column:1/-1}.card h2{font-size:20px;margin:0 0 12px}.card h3{font-size:16px;margin:22px 0 5px}.tag{display:inline-block;background:var(--soft);color:#4338ca;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}.reason{border-left:3px solid #f4b740;padding-left:14px;color:#596579}.overview{font-size:18px}.timeline{display:grid;gap:11px}.timeline div{padding:11px 14px;background:#fafafa;border-radius:12px}.timeline b{color:var(--accent);margin-right:8px}.points{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0;list-style:none}.points li{padding:11px 13px;border:1px solid var(--line);border-radius:12px}.resources{display:grid;gap:12px}.resource{padding:14px;border:1px solid var(--line);border-radius:14px}.resource a{color:var(--accent);font-weight:700;text-decoration:none}.resource small{display:block;color:var(--muted);margin-top:4px}.note{font-size:13px;color:var(--muted)}@media(max-width:760px){main{padding-top:22px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.star{font-size:45px}.points{grid-template-columns:1fr}}
</style></head><body><main id="app">加载今日主题…</main>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('data/today.json').then(r=>r.json()).then(d=>{const points=d.points.map(x=>`<li>${esc(x)}</li>`).join('');const resources=d.resources.map(x=>`<div class="resource"><span class="tag">${esc(x[0])}</span><br><a href="${esc(x[2])}" target="_blank" rel="noopener">${esc(x[1])} ↗</a><small>${esc(x[3])}</small></div>`).join('');document.title=d.title+' · 每日认识一个主题';document.getElementById('app').innerHTML=`<nav class="nav"><span>DAILY STUDY / 每日认识一个主题</span><a href="history.html">历史主题 →</a></nav><section class="hero"><div><div class="eyebrow">${esc(d.date_display)} · ${esc(d.category)}</div><h1>${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></div><div class="star">✦</div></section><div class="grid"><article class="card"><h2>它是什么？</h2><p class="overview">${esc(d.overview)}</p><p class="reason">${esc(d.why)}</p><h2>历史发展</h2><p>${esc(d.history)}</p></article><aside class="card"><h2>先抓住这几件事</h2><ul class="points">${points}</ul><h3>今天的选题线索</h3><p class="note">${esc(d.selection_reason)}</p></aside><article class="card wide"><h2>今天怎么了解它（约 1–2 小时）</h2><div class="timeline"><div><b>15 分钟</b>先读“它是什么”，建立基本词汇和参与者地图。</div><div><b>30 分钟</b>看一个中文概览视频，理解它的历史和现实场景。</div><div><b>30 分钟</b>听播客或访谈，接触不同人的叙述和观点。</div><div><b>30 分钟</b>按兴趣选择一篇文章、英文视频或数据材料自由浏览。</div></div></article><article class="card wide"><h2>推荐材料</h2><div class="resources">${resources}</div><p class="note">材料用于建立背景认知；新闻事实、研究结论和个人观点可能不同，请留意来源与发布时间。</p></article></div></article></div></main></body></html>`}).catch(()=>document.getElementById('app').textContent='今日主题暂时无法加载，请稍后刷新。');</script></body></html>
