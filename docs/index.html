<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日认识一个主题</title><style>:root{--ink:#172235;--muted:#667085;--paper:#f6f7fb;--card:#fff;--line:#e6e8ee;--accent:#4f46e5;--soft:#eef2ff;--gold:#f4b740}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.85 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1060px;margin:auto;padding:34px 20px 90px}.nav{display:flex;justify-content:space-between;margin-bottom:42px;color:var(--muted);font-size:14px}.nav a{color:var(--accent);text-decoration:none;font-weight:700}.hero{display:flex;justify-content:space-between;gap:22px;align-items:start;margin-bottom:25px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.12;margin:9px 0}.subtitle{font-size:20px;color:var(--muted);margin:0}.star{font-size:70px;color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.article,.side-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 10px 32px #17223508}.article h2{font-size:25px;line-height:1.3;margin:34px 0 10px}.article h2:first-child{margin-top:0}.article p{margin:0 0 16px}..lead{font-size:19px}..reason{border-left:3px solid var(--gold);padding-left:15px;color:#596579}.side{display:grid;align-content:start;gap:16px}.side-card h2{font-size:18px;margin:0 0 12px}.tag{display:inline-block;background:var(--soft);color:#4338ca;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}.points{list-style:none;padding:0;margin:0;display:grid;gap:8px}.points li{padding:9px 11px;border:1px solid var(--line);border-radius:11px;line-height:1.5}.timeline{display:grid;gap:10px;margin:12px 0 22px}.timeline div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 12px;background:#fafafa;border-radius:11px}.timeline b{color:var(--accent)}.chart{border:1px solid #dfe3ff;background:#fafaff;border-radius:16px;padding:16px;margin:14px 0}.chart h3{margin:0 0 12px;font-size:16px}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.flow span{background:#fff;border:1px solid #cfd5ff;border-radius:999px;padding:7px 12px;color:#3f3a9b}.flow i{color:var(--accent);font-style:normal}.resources{display:grid;gap:12px}.resource{padding:14px;border:1px solid var(--line);border-radius:14px}.resource a{color:var(--accent);font-weight:700;text-decoration:none}.resource small{display:block;color:var(--muted);margin-top:4px}.note{font-size:13px;color:var(--muted);line-height:1.6}.mode{font-size:12px;color:var(--muted)}@media(max-width:800px){main{padding-top:22px}.layout{grid-template-columns:1fr}.star{font-size:45px}.side{grid-row:1}.timeline div{grid-template-columns:1fr}.flow i{display:none}}
</style></head><body><main id="app">正在加载今天的长文…</main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const paras=x=>(x||[]).map(p=>`<p>${esc(p)}</p>`).join('');fetch('data/today.json').then(r=>r.json()).then(d=>{const sections=(d.sections||[]).map(s=>`<section><h2>${esc(s.heading)}</h2>${paras(s.paragraphs)}</section>`).join('');const timeline=(d.timeline||[]).map(x=>`<div><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div>`).join('');const chart=d.chart||{title:'理解路径',items:[]};const chartItems=(chart.items||[]).map((x,i)=>`<span>${esc(x)}</span>${i<chart.items.length-1?'<i>→</i>':''}`).join('');const resources=(d.resources||[]).map(x=>`<div class="resource"><span class="tag">${esc(x[0])}</span><br><a href="${esc(x[2])}" target="_blank" rel="noopener">${esc(x[1])} ↗</a><small>${esc(x[3]||'建议先看正文对应章节，再打开这项材料。')}</small></div>`).join('');document.title=d.title+' · 每日认识一个主题';document.getElementById('app').innerHTML=`<nav class="nav"><span>DAILY STUDY / 每日认识一个主题</span><a href="history.html">历史主题 →</a></nav><header class="hero"><div><div class="eyebrow">${esc(d.date_display)} · ${esc(d.category)}</div><h1>${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></div><div class="star">✦</div></header><div class="layout"><article class="article"><h2>先用几分钟知道它是什么</h2><div class="lead">${paras([d.overview])}</div><p class="reason">${esc(d.why)}</p><div class="chart"><h3>${esc(chart.title)}</h3><div class="flow">${chartItems}</div></div><h2>历史发展时间线</h2><div class="timeline">${timeline}</div>${sections}<h2>视频、播客与延伸材料</h2><p>正文用于建立整体理解；下面的材料用于从不同讲述者、案例和语言环境继续认识这个主题。优先选择具体单集或具体视频，只有找不到稳定单集链接时才保留搜索入口。</p><div class="resources">${resources}</div><p class="note">这是知识导览，不构成投资、医疗、政治或其他专业行动建议。涉及争议时，请区分公开事实、研究结论、评论观点和推测。</p></article><aside class="side"><div class="side-card"><span class="tag">${esc(d.article_mode==='deepseek'?'DeepSeek 长文模式':'本地备用模式')}</span><p class="mode">${esc(d.article_mode==='deepseek'?'今日文章由 DeepSeek 根据主题资料整理。':'今日 API 不可用，使用本地主题资料生成。')}</p></div><div class="side-card"><h2>今天先抓住这些词</h2><ul class="points">${(d.points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="side-card"><h2>选题线索</h2><p class="note">${esc(d.selection_reason)}</p></div><div class="side-card"><h2>建议用时</h2><p>正文阅读：约 60–90 分钟<br>视频与播客：按兴趣另行安排<br>今天的目标：知道它是什么、从哪里来、现在有哪些参与者。</p></div></aside></div>`}).catch(()=>document.getElementById('app').textContent='今日内容加载失败，请稍后刷新。');</script></body></html>
