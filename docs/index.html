<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="每天认识一个主题：基于真实资料自动整理的中文知识长文，附语音朗读、历史归档与延伸材料。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="每日认识一个主题">
  <meta property="og:description" content="每天一篇基于真实资料的中文知识长文，附语音朗读与延伸材料。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23e5a928'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="alternate" type="application/atom+xml" title="每日认识一个主题" href="feed.xml">
  <title>每日认识一个主题</title>
  <style>
    :root{--ink:#172235;--muted:#667085;--paper:#f4f6fa;--card:#fff;--line:#e2e6ef;--accent:#4f46e5;--accent2:#7c3aed;--soft:#eef2ff;--gold:#e5a928;--soft-bg:#fafbfe;--soft-line:#edf0f6;--chart-line:#dfe3ff;--chart-bg:#fafaff;--node-bg:#fff;--node-line:#cfd5ff;--node-ink:#3f3a9b;--tag-ink:#4338ca;--reason-ink:#596579;--rule:#f0f1f5;--shadow:0 12px 38px #1722350a}
    @media(prefers-color-scheme:dark){:root{--ink:#e7eaf3;--muted:#9aa4ba;--paper:#0e1320;--card:#171d2e;--line:#28304a;--accent:#8f97ff;--accent2:#b79bff;--soft:#242b52;--gold:#d9a93f;--soft-bg:#1a2136;--soft-line:#242c47;--chart-line:#2d3560;--chart-bg:#181f33;--node-bg:#1d2440;--node-line:#3a447c;--node-ink:#b0b7ff;--tag-ink:#bcc3ff;--reason-ink:#a8b1c6;--rule:#232b44;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/2 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    main{max-width:1120px;margin:auto;padding:32px 22px 90px}.nav{display:flex;justify-content:space-between;margin-bottom:46px;color:var(--muted);font-size:14px}.nav a{color:var(--accent);text-decoration:none;font-weight:700}
    .banner{margin:0 0 22px;padding:11px 16px;border:1px solid var(--gold);background:var(--soft-bg);border-radius:12px;font-size:14px;color:var(--muted)}.banner a{color:var(--accent);text-decoration:none;font-weight:700}
    .audio{margin:0 0 26px;padding:20px 24px;background:linear-gradient(135deg,var(--soft),var(--chart-bg));border:1px solid var(--chart-line);border-radius:18px}.audio h2{margin:0 0 5px;font-size:20px;line-height:1.4}.audio p{margin:0 0 12px;color:var(--muted);font-size:14px}.audio audio{display:block;width:100%;height:42px}.audio.missing{background:var(--soft-bg);border-color:var(--line)}.audio.missing p{margin:0}
    .hero{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.12;letter-spacing:-.03em;margin:10px 0}.subtitle{font-size:21px;color:var(--muted);margin:0}.star{font-size:72px;color:var(--gold)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.article,.side-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.article h2{font-size:26px;line-height:1.35;letter-spacing:-.01em;margin:42px 0 12px;padding-top:4px;border-top:1px solid var(--rule)}.article h2:first-child{margin-top:0;border-top:0}.article p{margin:0 0 20px}.lead{font-size:19px;line-height:2.05}.reason{border-left:3px solid var(--gold);padding-left:16px;color:var(--reason-ink);font-size:15px;line-height:1.8}
    .side{display:grid;gap:16px}.side-card h2{font-size:18px;line-height:1.4;margin:0 0 14px}.tag{display:inline-block;background:var(--soft);color:var(--tag-ink);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}.points{list-style:none;padding:0;margin:0;display:grid;gap:9px}.points li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;line-height:1.6}.mode,.note{font-size:13px;color:var(--muted);line-height:1.7}
    .timeline{display:grid;gap:11px;margin:14px 0 25px}.timeline div{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:13px 15px;background:var(--soft-bg);border:1px solid var(--soft-line);border-radius:13px;line-height:1.75}.timeline b{color:var(--accent)}.timeline small{display:block;color:var(--muted);font-size:13px}
    .chart{border:1px solid var(--chart-line);background:var(--chart-bg);border-radius:17px;padding:18px;margin:18px 0 26px}.chart h3{margin:0;font-size:17px;line-height:1.45}.chart p{font-size:13px;color:var(--muted);margin:3px 0 13px}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}.flow .node{background:var(--node-bg);border:1px solid var(--node-line);border-radius:13px;padding:9px 12px;min-width:120px;flex:1}.flow .node b{display:block;color:var(--node-ink);font-size:14px}.flow .node span{display:block;color:var(--muted);font-size:13px;line-height:1.55}.flow i{align-self:center;color:var(--accent);font-style:normal}
    .resources{display:grid;gap:13px}.resource{padding:15px;border:1px solid var(--line);border-radius:15px;line-height:1.7}.resource a{color:var(--accent);font-weight:700;text-decoration:none}.resource small{display:block;color:var(--muted);margin-top:5px;line-height:1.65}
    .sources{margin:0;padding-left:20px;font-size:14px;line-height:1.9;overflow-wrap:anywhere}.sources a{color:var(--accent);text-decoration:none}
    .pager{display:flex;justify-content:space-between;gap:14px;margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);font-size:14px;line-height:1.6}.pager a{color:var(--accent);text-decoration:none;font-weight:700}.pager .next{text-align:right;margin-left:auto}
    .footer-note{margin-top:28px!important;font-size:13px;color:var(--muted);line-height:1.7}
    @media(max-width:820px){main{padding:24px 16px 70px}.layout{grid-template-columns:1fr}.side{grid-row:1}.star{font-size:46px}.article,.side-card{padding:22px}.article h2{font-size:23px}.timeline div{grid-template-columns:1fr;gap:2px}.flow i{display:none}}
  </style>
</head>
<body><main id="app">正在加载今天的长文…</main>
<noscript><p style="max-width:720px;margin:20px auto;padding:0 22px">本页面需要启用 JavaScript 才能加载每日内容。</p></noscript>
<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const paras=xs=>(xs||[]).map(p=>`<p>${esc(p)}</p>`).join('');
  const app=document.getElementById('app');
  const qsDate=new URLSearchParams(location.search).get('date');
  const isArchive=!!(qsDate&&/^\d{4}-\d{2}-\d{2}$/.test(qsDate));
  const bust='?v='+Date.now();
  const dataUrl=isArchive?`data/archive/${qsDate}.json`:'data/today.json'+bust;
  const dayWord=isArchive?'当日':'今日';

  const audioBlock=d=>{
    const a=d.audio||{};
    if(a.status==='generated'&&a.url)
      return `<section class="audio"><h2>${dayWord}音频</h2><p>文章已自动生成语音，可直接收听。</p><audio controls preload="metadata" src="${esc(a.url+'?v='+(d.generated_at||d.date))}"></audio></section>`;
    return `<section class="audio missing"><h2>${dayWord}音频</h2><p>${dayWord}音频暂未生成，文字内容仍可正常阅读。</p></section>`;
  };

  const render=(d,hist)=>{
    const overview=Array.isArray(d.overview)?d.overview:[d.overview];
    const sections=(d.sections||[]).map(s=>`<section><h2>${esc(s.heading)}</h2>${paras(s.paragraphs)}</section>`).join('');
    const timeline=(d.timeline||[]).map(x=>`<div><b>${esc(x.label)}</b><span>${esc(x.text)}${x.detail?`<small>${esc(x.detail)}</small>`:''}</span></div>`).join('');
    const chart=d.chart||{title:'理解路径',subtitle:'',items:[]};
    const chartItems=(chart.items||[]).map((x,i)=>{const item=typeof x==='string'?{label:x,detail:'',relation:''}:x;return `<div class="node"><b>${esc(item.label)}</b><span>${esc(item.detail||item.relation||'')}</span></div>${i<chart.items.length-1?'<i>→</i>':''}`}).join('');
    const chartBlock=chart.items?.length?`<div class="chart"><h3>${esc(chart.title)}</h3><p>${esc(chart.subtitle||'')}</p><div class="flow">${chartItems}</div></div>`:'';
    const timelineBlock=d.timeline?.length?`<h2>时间线</h2><div class="timeline">${timeline}</div>`:'';
    const takeaways=d.key_takeaways?.length?`<section><h2>文章结论</h2>${paras(d.key_takeaways)}</section>`:'';
    const sources=d.sources_used?.length?`<section><h2>本文引用来源</h2><ul class="sources">${d.sources_used.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ul></section>`:'';
    const resources=(d.resources||[]).map(x=>`<div class="resource"><span class="tag">${esc(x[0])}</span><br><a href="${esc(x[2])}" target="_blank" rel="noopener">${esc(x[1])} ↗</a><small>${esc(x[3]||'建议先看正文对应章节，再打开这项材料。')}</small></div>`).join('');
    const chars=[...overview,...(d.sections||[]).flatMap(s=>s.paragraphs||[])].join('').length;
    const minutes=Math.max(1,Math.round(chars/450));
    const idx=hist.findIndex(x=>x.date===d.date);
    const older=idx>=0?hist[idx+1]:null;
    const newer=idx>0?hist[idx-1]:null;
    const linkFor=x=>hist[0]&&x.date===hist[0].date?'index.html':`index.html?date=${esc(x.date)}`;
    const pager=(older||newer)?`<nav class="pager">${older?`<a href="${linkFor(older)}">← ${esc(older.date)} · ${esc(older.title)}</a>`:''}${newer?`<a class="next" href="${linkFor(newer)}">${esc(newer.date)} · ${esc(newer.title)} →</a>`:''}</nav>`:'';
    const banner=isArchive?`<div class="banner">你正在查看 ${esc(d.date_display||d.date)} 的归档内容 · <a href="index.html">回到今日主题 →</a></div>`:'';
    document.title=d.title+' · 每日认识一个主题';
    const meta=document.querySelector('meta[name="description"]');
    if(meta&&overview[0])meta.setAttribute('content',String(overview[0]).slice(0,120));
    app.innerHTML=`<nav class="nav"><span>DAILY STUDY / 每日认识一个主题</span><a href="history.html">历史主题 →</a></nav>${banner}${audioBlock(d)}<header class="hero"><div><div class="eyebrow">${esc(d.date_display)} · ${esc(d.category)} · 全文约 ${chars} 字 / ${minutes} 分钟</div><h1>${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></div><div class="star" aria-hidden="true">✦</div></header><div class="layout"><article class="article"><div class="lead">${paras(overview)}</div>${d.why?`<p class="reason">${esc(d.why)}</p>`:''}${chartBlock}${timelineBlock}${sections}${takeaways}${sources}<h2>视频、播客与延伸材料</h2><p>正文用于建立整体理解；下面的材料用于接触不同讲述者、案例和观点。优先选择具体单集或具体视频，只有找不到稳定单集链接时才保留搜索入口。</p><div class="resources">${resources}</div><p class="footer-note">这是知识导览，不构成投资、医疗、政治或其他专业行动建议。涉及争议时，请区分公开事实、研究结论、评论观点和推测。</p>${pager}</article><aside class="side"><div class="side-card"><span class="tag">${esc(d.article_mode==='deepseek'?'DeepSeek 长文模式':'本地备用模式')}</span><p class="mode">${esc(d.article_mode==='deepseek'?`${dayWord}文章由 DeepSeek 根据主题资料整理。`:`${dayWord} API 不可用，使用本地主题资料生成。`)}</p></div><div class="side-card"><h2>主题关键词</h2><ul class="points">${(d.points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="side-card"><h2>选题线索</h2><p class="note">${esc(d.selection_reason)}</p></div></aside></div>`;
    const player=app.querySelector('.audio audio');
    if(player)player.addEventListener('error',()=>{
      const box=app.querySelector('.audio');
      if(box){box.classList.add('missing');box.innerHTML=`<h2>${dayWord}音频</h2><p>音频文件已超出保留期或暂不可用，文字内容不受影响。</p>`}
    },{once:true});
  };

  Promise.all([
    fetch(dataUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}),
    fetch('data/history.json'+bust,{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]).then(([d,hist])=>render(d,Array.isArray(hist)?hist:[])).catch(err=>{
    app.innerHTML=isArchive
      ?`<nav class="nav"><span>DAILY STUDY / 每日认识一个主题</span><a href="history.html">历史主题 →</a></nav><p>没有找到 ${esc(qsDate)} 的归档内容（${esc(err.message)}）。</p><p><a href="index.html" style="color:var(--accent);font-weight:700;text-decoration:none">回到今日主题 →</a></p>`
      :`<p>今日内容加载失败（${esc(err.message)}），请稍后刷新。</p>`;
  });
</script></body></html>
