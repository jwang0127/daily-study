<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>每日认识一个主题</title>
  <style>
    :root{--ink:#172235;--muted:#667085;--paper:#f4f6fa;--card:#fff;--line:#e2e6ef;--accent:#4f46e5;--accent2:#7c3aed;--soft:#eef2ff;--gold:#e5a928}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/2 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    main{max-width:1120px;margin:auto;padding:32px 22px 90px}.nav{display:flex;justify-content:space-between;margin-bottom:46px;color:var(--muted);font-size:14px}.nav a{color:var(--accent);text-decoration:none;font-weight:700}
    .hero{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.12;letter-spacing:-.03em;margin:10px 0}.subtitle{font-size:21px;color:var(--muted);margin:0}.star{font-size:72px;color:var(--gold)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.article,.side-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 12px 38px #1722350a}.article h2{font-size:26px;line-height:1.35;letter-spacing:-.01em;margin:42px 0 12px;padding-top:4px;border-top:1px solid #f0f1f5}.article h2:first-child{margin-top:0;border-top:0}.article p{margin:0 0 20px}.lead{font-size:19px;line-height:2.05}.reason{border-left:3px solid var(--gold);padding-left:16px;color:#596579;font-size:15px;line-height:1.8}
    .side{display:grid;gap:16px}.side-card h2{font-size:18px;line-height:1.4;margin:0 0 14px}.tag{display:inline-block;background:var(--soft);color:#4338ca;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}.points{list-style:none;padding:0;margin:0;display:grid;gap:9px}.points li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;line-height:1.6}.mode,.note{font-size:13px;color:var(--muted);line-height:1.7}
    .timeline{display:grid;gap:11px;margin:14px 0 25px}.timeline div{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:13px 15px;background:#fafbfe;border:1px solid #edf0f6;border-radius:13px;line-height:1.75}.timeline b{color:var(--accent)}.timeline small{display:block;color:var(--muted);font-size:13px}
    .chart{border:1px solid #dfe3ff;background:#fafaff;border-radius:17px;padding:18px;margin:18px 0 26px}.chart h3{margin:0;font-size:17px;line-height:1.45}.chart p{font-size:13px;color:var(--muted);margin:3px 0 13px}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}.flow .node{background:#fff;border:1px solid #cfd5ff;border-radius:13px;padding:9px 12px;min-width:120px;flex:1}.flow .node b{display:block;color:#3f3a9b;font-size:14px}.flow .node span{display:block;color:var(--muted);font-size:13px;line-height:1.55}.flow i{align-self:center;color:var(--accent);font-style:normal}
    .resources{display:grid;gap:13px}.resource{padding:15px;border:1px solid var(--line);border-radius:15px;line-height:1.7}.resource a{color:var(--accent);font-weight:700;text-decoration:none}.resource small{display:block;color:var(--muted);margin-top:5px;line-height:1.65}.footer-note{margin-top:28px!important;font-size:13px;color:var(--muted);line-height:1.7}
    @media(max-width:820px){main{padding:24px 16px 70px}.layout{grid-template-columns:1fr}.side{grid-row:1}.star{font-size:46px}.article,.side-card{padding:22px}.article h2{font-size:23px}.timeline div{grid-template-columns:1fr;gap:2px}.flow i{display:none}}
  </style>
</head>
<body><main id="app">正在加载今天的长文…</main>
<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const paras=xs=>(xs||[]).map(p=>`<p>${esc(p)}</p>`).join('');
  const todayUrl='data/today.json?v='+Date.now();
  fetch(todayUrl,{cache:'no-store'}).then(r=>r.json()).then(d=>{
    const sections=(d.sections||[]).map(s=>`<section><h2>${esc(s.heading)}</h2>${paras(s.paragraphs)}</section>`).join('');
    const timeline=(d.timeline||[]).map(x=>`<div><b>${esc(x.label)}</b><span>${esc(x.text)}${x.detail?`<small>${esc(x.detail)}</small>`:''}</span></div>`).join('');
    const chart=d.chart||{title:'理解路径',subtitle:'',items:[]};
    const chartItems=(chart.items||[]).map((x,i)=>{const item=typeof x==='string'?{label:x,detail:'',relation:''}:x;return `<div class="node"><b>${esc(item.label)}</b><span>${esc(item.detail||item.relation||'')}</span></div>${i<chart.items.length-1?'<i>→</i>':''}`}).join('');
    const resources=(d.resources||[]).map(x=>`<div class="resource"><span class="tag">${esc(x[0])}</span><br><a href="${esc(x[2])}" target="_blank" rel="noopener">${esc(x[1])} ↗</a><small>${esc(x[3]||'建议先看正文对应章节，再打开这项材料。')}</small></div>`).join('');
    document.title=d.title+' · 每日认识一个主题';
    document.getElementById('app').innerHTML=`<nav class="nav"><span>DAILY STUDY / 每日认识一个主题</span><a href="history.html">历史主题 →</a></nav><header class="hero"><div><div class="eyebrow">${esc(d.date_display)} · ${esc(d.category)}</div><h1>${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></div><div class="star">✦</div></header><div class="layout"><article class="article"><h2>先用几分钟知道它是什么</h2><div class="lead">${paras([d.overview])}</div><p class="reason">${esc(d.why)}</p><div class="chart"><h3>${esc(chart.title)}</h3><p>${esc(chart.subtitle||'这张图把概念、历史、参与者与争议放在同一个理解框架里。')}</p><div class="flow">${chartItems}</div></div><h2>历史发展时间线</h2><div class="timeline">${timeline}</div>${sections}<h2>视频、播客与延伸材料</h2><p>正文用于建立整体理解；下面的材料用于接触不同讲述者、案例和观点。优先选择具体单集或具体视频，只有找不到稳定单集链接时才保留搜索入口。</p><div class="resources">${resources}</div><p class="footer-note">这是知识导览，不构成投资、医疗、政治或其他专业行动建议。涉及争议时，请区分公开事实、研究结论、评论观点和推测。</p></article><aside class="side"><div class="side-card"><span class="tag">${esc(d.article_mode==='deepseek'?'DeepSeek 长文模式':'本地备用模式')}</span><p class="mode">${esc(d.article_mode==='deepseek'?'今日文章由 DeepSeek 根据主题资料整理。':'今日 API 不可用，使用本地主题资料生成。')}</p></div><div class="side-card"><h2>主题关键词</h2><ul class="points">${(d.points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="side-card"><h2>选题线索</h2><p class="note">${esc(d.selection_reason)}</p></div></aside></div>`;
  }).catch(()=>document.getElementById('app').textContent='今日内容加载失败，请稍后刷新。');
</script>
<script>
  // Keep the audio block at the very top without coupling it to the long
  // article template above. The daily JSON is the single source of truth.
  fetch(todayUrl,{cache:'no-store'}).then(r=>r.json()).then(d=>{
    const audio=d.audio||{};
    const panel=audio.status==='generated'&&audio.url
      ? `<section style="margin:0 0 26px;padding:20px 24px;background:linear-gradient(135deg,#eef2ff,#faf5ff);border:1px solid #dfe3ff;border-radius:18px"><h2 style="margin:0 0 5px;font-size:20px;line-height:1.4">今日音频</h2><p style="margin:0 0 12px;color:#667085;font-size:14px">文章已自动生成语音，可直接收听。</p><audio controls preload="metadata" src="${esc(audio.url)}" style="display:block;width:100%;height:42px"></audio></section>`
      : `<section style="margin:0 0 26px;padding:20px 24px;background:#fafbfe;border:1px solid #e2e6ef;border-radius:18px"><h2 style="margin:0 0 5px;font-size:20px;line-height:1.4">今日音频</h2><p style="margin:0;color:#667085;font-size:14px">今日音频暂未生成，文字内容仍可正常阅读。</p></section>`;
    const app=document.getElementById('app');
    let observer;
    const insertPanel=()=>{
      if(app.querySelector('.layout')&&!app.querySelector('audio')){
        app.insertAdjacentHTML('afterbegin',panel);
        if(observer) observer.disconnect();
        return true;
      }
      return false;
    };
    if(!insertPanel()){
      observer=new MutationObserver(insertPanel);
      observer.observe(app,{childList:true});
    }
  });
</script></body></html>
