<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史主题 · Daily Study</title><style>body{margin:0;background:#f6f7fb;color:#172235;font:16px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:900px;margin:auto;padding:38px 20px 80px}a{color:#4f46e5;text-decoration:none;font-weight:700}.top{display:flex;justify-content:space-between;margin-bottom:35px}.intro{color:#667085}.item{display:block;background:white;border:1px solid #e6e8ee;border-radius:16px;padding:18px 20px;margin:12px 0}.date{color:#667085;font-size:13px}.cat{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:99px;padding:2px 9px;font-size:12px;margin-left:8px}.item h2{margin:5px 0;font-size:20px}.item p{margin:0;color:#667085}</style></head><body><main><div class="top"><a href="index.html">← 今日主题</a><span>DAILY STUDY</span></div><h1>历史主题</h1><p class="intro">这里保留每天认识过的主题。每天只生成一个新主题，方便慢慢积累一张自己的知识地图。</p><section id="list">加载中…</section></main><script>fetch('data/history.json').then(r=>r.json()).then(xs=>{document.getElementById('list').innerHTML=xs.map(x=>`<a class="item" href="data/archive/${x.date}.json" target="_blank"><span class="date">${x.date_display}</span><span class="cat">${x.category}</span><h2>${x.title}</h2><p>${x.subtitle}</p></a>`).join('')}).catch(()=>document.getElementById('list').textContent='历史记录暂时无法加载。');</script></body></html>
