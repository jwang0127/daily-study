name: Update daily study

on:
  schedule:
    - cron: "0 23 * * *" # 07:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate today's study pack
        run: python scripts/generate_study.py
      - name: Commit changed study pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/today.json
          git diff --cached --quiet || git commit -m "chore: update daily study pack"
          git push
