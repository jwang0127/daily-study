name: Generate daily knowledge guide

on:
  push:
    paths:
      - "config/topics.json"
      - "scripts/generate_study.py"
      - ".github/workflows/daily-study.yml"
  schedule:
    - cron: "0 1 * * *" # 09:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

concurrency:
  group: daily-study-generation
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate one daily topic and archive it
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENT_TTS_VOICE_TYPE: "1001"
        run: python -u scripts/generate_study.py
      - name: Commit today's page and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/audio docs/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
          else
            git commit -m "chore: publish daily knowledge guide"
            git pull --rebase origin master
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy generated site
        uses: actions/deploy-pages@v4
