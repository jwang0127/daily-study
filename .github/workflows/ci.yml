name: CI

on:
  push:
    branches: [master]
    paths: ["scripts/**", "tests/**", "requirements.txt", ".github/workflows/ci.yml"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile scripts/generate_study.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
